[project]
name = "praxeon"
version = "1.1.0"
description = "Runtime supervision for autonomous AI agents"

readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.24.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]


[project.urls]
Homepage = "https://github.com/AndreuVM/praxeon"
Repository = "https://github.com/AndreuVM/praxeon.git"
Issues = "https://github.com/AndreuVM/praxeon/issues"


[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "typesafe-sdk>=0.7.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]
desktop = [
    "pywebview>=5.0",
]
decision-laya = [
    "laya>=0.3.0",
]
decision-typesafe = [
    "typesafe-sdk>=0.7.0",
]
decision-all = [
    "laya>=0.3.0",
    "typesafe-sdk>=0.7.0",
]
laya = [
    "laya>=0.3.0",
]
typesafe = [
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
praxeon = "praxeon.cli:main"
praxeon-live = "praxeon.live_agent:main"
praxeon-dash = "praxeon.dashboard:main"
praxeon-server = "praxeon.server.app:start"
praxeon-web = "praxeon.server.app:launch_web"
praxeon-app = "praxeon.desktop.app:main"
praxeon-mcp = "praxeon.integrations.mcp.server:main"
# Legacy aliases (deprecated, scheduled for removal in v2.0)
jev-nav = "praxeon.legacy_cli:jev_nav_main"
jev-live = "praxeon.legacy_cli:jev_live_main"
jev-dash = "praxeon.legacy_cli:jev_dash_main"
jev-mcp = "praxeon.legacy_cli:jev_mcp_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxeon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Tests unitarios atomicos, puros y rapidos sin I/O pesado ni servidor",
    "integration: Tests de integracion de servicios, almacenamiento y protocolos",
    "e2e: Tests end-to-end de ciclo de vida completo de plataforma y agentes",
    "security: Tests de seguridad, HMAC, autorizacion, limites y aislamiento",
    "providers: Tests de proveedores de inferencia y evaluacion semantica",
    "benchmark: Tests de rendimiento, ablacion y benchmarking comparativo",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["web", "dist", "videos", "scratch", ".venv"]

[tool.ruff.lint]
# Reglas bloqueantes en CI: errores reales (F), sintaxis (E9), causa en excepciones encadenadas (B904),
# conjuntos duplicados (B033), variables de bucle sin usar (B007) y zip sin strict (B905).
select = ["F", "E9", "B904", "B033", "B007", "B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F841", "B007", "B904", "B905"]
"scripts/*" = ["F401", "F841", "B007", "B904", "B905"]
"examples/*" = ["F401", "F841", "B007", "B904", "B905"]
"demo.py" = ["F401", "F841"]
"generate_audit_pdf.py" = ["F401", "F841", "B007"]
"run_praxeon.py" = ["F401", "F841"]

[tool.coverage.run]
source = ["praxeon"]
branch = true
omit = ["praxeon/server/static/*"]

[tool.coverage.report]
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
