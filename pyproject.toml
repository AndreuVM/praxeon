[project]
name = "praxeon"
version = "1.0.0"
description = "Runtime supervision for autonomous AI agents"

readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.24.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typesafe-sdk>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/AndreuVM/praxeon"
Repository = "https://github.com/AndreuVM/praxeon.git"
Issues = "https://github.com/AndreuVM/praxeon/issues"


[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]
laya = [
    "laya>=0.3.0",
]

[project.scripts]
praxeon = "praxeon.cli:main"
praxeon-live = "praxeon.live_agent:main"
praxeon-dash = "praxeon.dashboard:main"
praxeon-server = "praxeon.server.app:start"
praxeon-web = "praxeon.server.app:launch_web"
praxeon-mcp = "praxeon.integrations.mcp.server:main"
# Legacy aliases (deprecated, maintained for backward compatibility)
jev-nav = "praxeon.cli:main"
jev-live = "praxeon.live_agent:main"
jev-dash = "praxeon.dashboard:main"
jev-mcp = "praxeon.integrations.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxeon"]
