[project]
name = "praxeon"
version = "1.2.0"
description = "Runtime supervision for autonomous AI agents"

readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.24.0",
    "httpx>=0.27.0",          # cliente HTTP compartido de los proveedores (ya llegaba como dependencia de google-genai)
    "jsonschema>=4.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]


[project.urls]
Homepage = "https://github.com/AndreuVM/praxeon"
Repository = "https://github.com/AndreuVM/praxeon.git"
Issues = "https://github.com/AndreuVM/praxeon/issues"


[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff==0.17.5",          # fijada: una versión nueva con reglas nuevas no debe romper CI sin aviso
    "mypy>=2.4",
    "typesafe-sdk>=0.7.0",
]
# El servidor ya va en las dependencias obligatorias; el extra se conserva vacío para que `praxeon[server]` siga
# instalándose sin aviso.
server = []
desktop = [
    "pywebview>=5.0",
]
decision-laya = [
    "laya>=0.3.0",
]
decision-typesafe = [
    "typesafe-sdk>=0.7.0",
]
decision-all = [
    "laya>=0.3.0",
    "typesafe-sdk>=0.7.0",
]
laya = [
    "laya>=0.3.0",
]
typesafe = [
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
praxeon = "praxeon.cli:main"
praxeon-live = "praxeon.live_agent:main"
praxeon-dash = "praxeon.dashboard:main"
praxeon-server = "praxeon.server.app:start"
praxeon-web = "praxeon.server.app:launch_web"
praxeon-app = "praxeon.desktop.app:main"
praxeon-mcp = "praxeon.integrations.mcp.server:main"
# Legacy aliases (deprecated, scheduled for removal in v2.0)
jev-nav = "praxeon.legacy_cli:jev_nav_main"
jev-live = "praxeon.legacy_cli:jev_live_main"
jev-dash = "praxeon.legacy_cli:jev_dash_main"
jev-mcp = "praxeon.legacy_cli:jev_mcp_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# La interfaz compilada no se versiona (está en .gitignore), pero debe ir en el sdist y en el wheel:
# se genera con scripts/build_frontend.py antes de empaquetar
artifacts = ["praxeon/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["praxeon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Tests unitarios atomicos, puros y rapidos sin I/O pesado ni servidor",
    "integration: Tests de integracion de servicios, almacenamiento y protocolos",
    "e2e: Tests end-to-end de ciclo de vida completo de plataforma y agentes",
    "security: Tests de seguridad, HMAC, autorizacion, limites y aislamiento",
    "providers: Tests de proveedores de inferencia y evaluacion semantica",
    "benchmark: Tests de rendimiento, ablacion y benchmarking comparativo",
    "laya_neural: Usa el modelo neuronal real del paquete laya (descarga pesos; se salta si no esta instalado)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["web", "dist", "videos", "scratch", ".venv"]

[tool.ruff.lint]
# Reglas bloqueantes en CI: errores reales (F), sintaxis (E9), causa en excepciones encadenadas (B904),
# conjuntos duplicados (B033), variables de bucle sin usar (B007), zip sin strict (B905) y, desde la auditoría
# (AUD-12, Q-02), ningún `except Exception: pass/continue` silencioso (S110/S112): se registra con `logger` o se
# justifica con `# noqa: S110 - motivo` si es una limpieza best-effort.
# Etapa 2 (AUD-23): UP (anotaciones y APIs modernas de Python 3.11: `list[int]`, `X | None`, `datetime.UTC`).
# BLE001 (AUD-23): ningún `except Exception` sin decidir. Se estrecha a las excepciones reales o se deja ancho con
# `# noqa: BLE001 - motivo` (frontera con un proveedor, el disco o el host; limpieza; rutas fail-closed).
# E501 (líneas de más de 120) NO se exige, por decisión (AUD-23, 2026-11-15): hay 1 237 en praxeon/, 963 de ellas pasan
# el límite por menos de 20 caracteres, y `ruff format` reformatearía 206 de 248 ficheros (~10 500 líneas) y borraría el
# `git blame` sin arreglar nada de fondo. Se reconsidera si se adopta un formateador de forma deliberada.
select = ["F", "E9", "B904", "B033", "B007", "B905", "S110", "S112", "UP", "BLE001"]
# UP042 (`class X(str, Enum)` -> `StrEnum`) cambia lo que devuelve `str()` y `format()` de los valores, que están
# serializados en eventos, recibos y la API: se mantiene `(str, Enum)` a propósito.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F841", "B007", "B904", "B905", "S110", "S112", "UP", "BLE001"]
"scripts/*" = ["F401", "F841", "B007", "B904", "B905", "S110", "S112", "UP", "BLE001"]
"examples/*" = ["F401", "F841", "B007", "B904", "B905", "S110", "S112", "UP", "BLE001"]
"demo.py" = ["F401", "F841", "UP", "BLE001"]
"run_praxeon.py" = ["F401", "F841", "UP", "BLE001"]

[tool.mypy]
# Etapa 1 (AUD-12): el núcleo de decisión y ejecución sin errores en modo normal. Etapa 2 (AUD-23): también praxeon/server.
# Siguiente: --strict paquete a paquete. Las dependencias sin tipos se tratan como Any.
python_version = "3.11"
files = ["praxeon/domain", "praxeon/policy", "praxeon/runtime", "praxeon/server", "praxeon/core/pipeline.py"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true

# --strict paquete a paquete (AUD-23). mypy no admite `strict = true` por módulo: se listan las opciones que `--strict` activa.
# Para añadir un paquete: que `mypy --strict <paquete>` dé 0 errores y añadir su patrón aquí. Pendientes: runtime, server.
[[tool.mypy.overrides]]
module = ["praxeon.domain.*", "praxeon.policy.*", "praxeon.core.pipeline"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.coverage.run]
source = ["praxeon"]
branch = true
omit = ["praxeon/server/static/*"]

[tool.coverage.report]
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.praxeon-coverage]
# Mínimo de cobertura por módulo (líneas + ramas, como --cov-fail-under) que comprueba scripts/check_module_coverage.py
# en CI (auditoría Q-03). Una clave que termina en "/" es un paquete entero. El total sigue en --cov-fail-under=70.
# policy/permissions.py y policy/egress.py llevan mínimo propio: eran los más bajos del paquete y no deben esconderse en
# su media. Pendiente de subir a 90: policy/failsafe.py, sanitizer.py, registry.py y reconciliation.py.
"praxeon/runtime/executor.py" = 90
"praxeon/server/services/auth_service.py" = 90
"praxeon/policy/" = 90
"praxeon/policy/permissions.py" = 90
"praxeon/policy/egress.py" = 90
