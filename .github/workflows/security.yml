name: Security Audit & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Cada lunes a las 00:00 UTC

jobs:
  security:
    name: Security & Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit

      - name: Run Bandit (Security Linter)
        run: |
          bandit -r praxeon/ -ll -ii --exclude praxeon/tests

      - name: Verify Formal Invariants and Capability Verification Suite
        run: |
          pytest tests/test_properties.py tests/security/ -v
