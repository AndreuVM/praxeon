name: Security Audit & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Cada lunes a las 00:00 UTC

jobs:
  security:
    name: Security & Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit

      - name: "Run Bandit (bloqueante, severidad media/alta)"
        run: |
          bandit -r praxeon/ -ll -ii --exclude praxeon/tests

      - name: "Bandit informe completo (informativo, incluye severidad baja)"
        continue-on-error: true
        run: |
          bandit -r praxeon/ --exclude praxeon/tests -f txt

      - name: Auditoria de dependencias (pip-audit, informativo)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --skip-editable

      - name: Verify Formal Invariants and Capability Verification Suite
        run: |
          pytest tests/test_properties.py tests/security/ -v
