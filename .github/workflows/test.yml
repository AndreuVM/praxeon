name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff==0.17.5"

      - name: Ruff (reglas bloqueantes definidas en pyproject.toml)
        run: ruff check .

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked: instala exactamente uv.lock y falla si el lockfile no corresponde a pyproject.toml (auditoría A-07)
      - name: Install dependencies (uv.lock)
        run: uv sync --locked --extra dev --python 3.11

      - name: Mypy (paquetes y opciones en [tool.mypy] de pyproject.toml)
        run: uv run --no-sync mypy

  test:
    name: Backend Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked: los tests corren con las versiones de uv.lock, las mismas que en local (auditoría A-07)
      - name: Install dependencies (uv.lock)
        run: uv sync --locked --extra dev --extra decision-typesafe --python ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      # Aislamiento fuerte en Linux (AUD-19): bubblewrap y espacios de nombres de usuario sin privilegios, que Ubuntu
      # restringe con AppArmor. Así tests/security/test_isolation.py prueba el aislamiento real, no solo los argumentos.
      - name: Install bubblewrap (isolation tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # La interfaz no se versiona: se compila para que los tests de entrega de la UI se ejecuten (no se salten)
      - name: Build Frontend
        run: python scripts/build_frontend.py

      - name: Run Test Suite with Pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
        run: |
          uv run --no-sync pytest -v --durations=10

      - name: Run Test Suite with Coverage (umbral minimo 70%)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run --no-sync pytest -v --durations=10 --cov=praxeon --cov-report=term --cov-report=xml --cov-report=json --cov-fail-under=70

      - name: Cobertura por módulo (mínimos de [tool.praxeon-coverage])
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run --no-sync python scripts/check_module_coverage.py coverage.json pyproject.toml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Run Formal Verification Benchmark (10 scenarios)
        run: |
          uv run --no-sync python -m praxeon.cli benchmark

      - name: Run Ablation Study
        run: |
          uv run --no-sync python -m praxeon.cli benchmark --ablation

  frontend:
    name: Frontend Lint & Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Lint Frontend (oxlint)
        working-directory: web
        run: npm run lint

      - name: Frontend unit tests (Vitest)
        working-directory: web
        run: npm test

      - name: Build Frontend Production Bundle (Vite)
        working-directory: web
        run: npm run build

  packaging:
    name: Python Wheel & Packaging Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # praxeon/server/static no se versiona: se compila desde web/src para que el wheel lleve la interfaz actual
      - name: Build Frontend into the Package
        run: python scripts/build_frontend.py

      - name: Build Wheel & Source Distribution
        run: python -m build

      - name: Verify the Wheel Ships the Web Interface
        run: |
          python -c "import sys, zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'praxeon/server/static/index.html' in names else 'el wheel no incluye la interfaz web')"

      - name: Verify Package Metadata
        run: twine check dist/*

      - name: Clean Install from Wheel (Pure Core without Optional Extras)
        run: |
          python -m venv clean_env
          clean_env/bin/python -m pip install --upgrade pip
          clean_env/bin/pip install dist/*.whl

      - name: CLI Smoke Test from Installed Wheel
        run: |
          clean_env/bin/praxeon --help
          clean_env/bin/praxeon benchmark --help
          clean_env/bin/praxeon-server --help

      - name: Verify Clean Core Import (Zero Mandatory TypeSafe/LAYA Dependency)
        run: |
          clean_env/bin/python -c "import praxeon; from praxeon.providers.registry import default_registry; print('Loaded providers:', [p['provider_id'] for p in default_registry.list_providers()]); print('PRAXEON core wheel verified successfully!')"

  core-independence:
    name: Pure Core Independence Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Pure Core (Without Optional Extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx

      - name: Run Core Tests Without Optional Extras
        run: |
          pytest tests/test_sec01_ssrf_protection.py tests/test_p2_ui_context_resilience.py tests/test_properties.py -v
