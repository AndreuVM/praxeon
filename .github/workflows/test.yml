name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,decision-typesafe]"

      - name: Run Test Suite with Pytest
        run: |
          pytest -v --durations=10

      - name: Run Formal Verification Benchmark (10 scenarios)
        run: |
          python -m praxeon.cli benchmark

      - name: Run Ablation Study
        run: |
          python -m praxeon.cli benchmark --ablation

  frontend:
    name: Frontend Lint & Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Lint Frontend (oxlint)
        working-directory: web
        run: npm run lint

      - name: Build Frontend Production Bundle (Vite)
        working-directory: web
        run: npm run build

  packaging:
    name: Python Wheel & Packaging Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Wheel & Source Distribution
        run: python -m build

      - name: Verify Package Metadata
        run: twine check dist/*

      - name: Clean Install from Wheel (Pure Core without Optional Extras)
        run: |
          python -m venv clean_env
          clean_env/bin/python -m pip install --upgrade pip
          clean_env/bin/pip install dist/*.whl

      - name: CLI Smoke Test from Installed Wheel
        run: |
          clean_env/bin/praxeon --help
          clean_env/bin/praxeon benchmark --help
          clean_env/bin/praxeon-server --help

      - name: Verify Clean Core Import (Zero Mandatory TypeSafe/LAYA Dependency)
        run: |
          clean_env/bin/python -c "import praxeon; from praxeon.providers.registry import default_registry; print('Loaded providers:', [p['provider_id'] for p in default_registry.list_providers()]); print('PRAXEON core wheel verified successfully!')"

  core-independence:
    name: Pure Core Independence Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pure Core (Without Optional Extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx

      - name: Run Core Tests Without Optional Extras
        run: |
          pytest tests/test_sec01_ssrf_protection.py tests/test_p2_ui_context_resilience.py tests/test_properties.py -v
