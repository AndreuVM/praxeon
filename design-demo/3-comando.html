<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praxeon · Comando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/* Comando: lienzo a pantalla completa, navegación por paleta (Ctrl/⌘ + K) y paneles flotantes */
:root{--b:#111214;--s:#1a1b1e;--l:#2b2d31;--t:#ececee;--m:#8b8e94;--a:#f2b66b;--ab:#17130b;--ok:#7ccf9a;--bad:#ef8a80;--f:'Instrument Sans',system-ui,sans-serif;--fm:'Geist Mono',ui-monospace,monospace;--r:10px}
body{background-image:radial-gradient(#25272b 1px,transparent 1px);background-size:22px 22px}
.tl{position:fixed;left:20px;top:16px;display:flex;align-items:center;gap:10px;z-index:5}
.tl b{font-weight:600}
.cmd{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(340px,50vw);background:var(--s);border:1px solid var(--l);border-radius:99px;padding:8px 14px;display:flex;gap:9px;align-items:center;color:var(--m);z-index:5}
.cmd:hover{border-color:var(--m)}
.cmd kbd{margin-left:auto}
.cvs{position:fixed;inset:0;padding:78px 20px 90px}
.cvs .tree{height:100%}
.cvs.shift{right:360px}
.card{position:fixed;right:16px;top:64px;bottom:16px;width:330px;background:var(--s);border:1px solid var(--l);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto;z-index:4;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .hd b{font-weight:600;font-size:14px}
.card .x{color:var(--m);padding:4px;border-radius:6px}
.card .x:hover{color:var(--t);background:var(--l)}
.card .tabs{gap:14px;margin-top:auto}
.comp{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(520px,calc(100% - 40px));background:var(--s);border:1px solid var(--l);border-radius:99px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 18px;z-index:5}
.comp.shift{left:calc(50% - 180px)}
.comp:focus-within{border-color:var(--m)}
.comp input{flex:1;min-width:0}
.comp input::placeholder{color:var(--m)}
.btn{border-radius:99px;padding:7px 16px}
.scrim{position:fixed;inset:0;background:rgba(8,8,9,.6);z-index:20;display:flex;justify-content:center}
.pal{margin-top:14vh;width:min(520px,calc(100% - 32px));height:fit-content;background:var(--s);border:1px solid var(--l);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.pal .in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--l);color:var(--m)}
.pal .in input{flex:1;color:var(--t);font-size:14px}
.pal .list{padding:6px;max-height:340px;overflow:auto}
.pal .it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;color:var(--m)}
.pal .it.on{background:#26282c;color:var(--t)}
.pal .it kbd{margin-left:auto}
.pal .grp{padding:8px 12px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--m)}
.sheet{position:fixed;inset:60px 24px 24px;max-width:960px;margin:0 auto;background:var(--s);border:1px solid var(--l);border-radius:18px;z-index:10;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--l);color:var(--m)}
.sheet .sb{overflow:auto;padding:26px 28px;flex:1}
.hint{position:fixed;left:20px;top:44px;color:var(--m);font-size:11.5px;z-index:3}
@media (max-width:900px){.hint{display:none}.cvs.shift{right:0}.card{top:auto;height:55%;width:calc(100% - 32px)}.comp.shift{left:50%}}
</style>
</head>
<body>
<div class="tl"><b>Praxeon</b><span class="chip"><span class="dot" id="sd"></span><span class="mono">7f3a2c</span></span></div>
<button class="cmd" id="open"><span>Ir a una vista o ejecutar una acción</span><kbd>Ctrl K</kbd></button>
<div class="cvs" id="cvs"><div id="tree"></div></div>
<aside class="card" id="card"></aside>
<form class="comp" id="form"><input id="q" placeholder="Dale una misión al agente…" aria-label="Misión"><span class="dim">Simulado ▾</span><button class="btn" type="submit">Enviar</button></form>
<div class="hint">G luego S, D, A, F, P, T, X, E para saltar de vista · Esc para cerrar</div>
<div id="layer"></div>
<script src="shared.js"></script>
<script>
(function(){
  var M=PX.M, tab='decision', cardOpen=true, sheet=null, pal=null;
  document.getElementById('open').innerHTML=PX.icon('search')+'<span>Ir a una vista o ejecutar una acción</span><kbd>Ctrl K</kbd>';
  PX.tree(document.getElementById('tree'),{onSelect:function(){cardOpen=true;paintCard()}});

  var SHORT={sessions:'G S',decisions:'G D',agents:'G A',workflows:'G F',providers:'G P',mcp:'G T',security:'G X',settings:'G E'};
  var KEY={s:'sessions',d:'decisions',a:'agents',f:'workflows',p:'providers',t:'mcp',x:'security',e:'settings',l:'live'};
  function items(){
    var v=PX.VIEWS.map(function(x){return {g:'Vistas',label:x.id==='live'?'Live (lienzo)':x.label,icon:x.id,key:SHORT[x.id]||'',run:function(){openView(x.id)}}});
    return v.concat([
      {g:'Acciones',label:'Nueva misión (reiniciar demo)',icon:'live',key:'',run:function(){M.run()}},
      {g:'Acciones',label:cardOpen?'Ocultar panel de decisión':'Mostrar panel de decisión',icon:'decisions',key:'',run:function(){cardOpen=!cardOpen;paintCard()}}
    ]);
  }
  function openView(id){sheet=id==='live'?null:id;paintSheet()}
  function paintSheet(){
    var h='';
    if(sheet)h='<div class="sheet" role="dialog" aria-label="'+PX.viewLabel(sheet)+'"><div class="sh"><span>'+PX.viewLabel(sheet)+'</span><button class="x" data-close aria-label="Cerrar">'+PX.icon('x')+'</button></div><div class="sb">'+PX.viewHTML(sheet)+'</div></div>';
    document.getElementById('layer').innerHTML=h+paletteHTML();
    var inp=document.getElementById('pq');if(inp)inp.focus();
  }
  document.getElementById('layer').addEventListener('click',function(e){
    if(e.target.closest('[data-close]')){sheet=null;paintSheet();return}
    var it=e.target.closest('[data-i]');if(it&&pal){var r=pal.list[+it.dataset.i];closePal();r.run();return}
    if(e.target.classList.contains('scrim'))closePal();
  });
  function filtered(q){q=(q||'').toLowerCase();return items().filter(function(i){return i.label.toLowerCase().indexOf(q)>-1})}
  function paletteHTML(){
    if(!pal)return '';
    var h='',last='';
    pal.list.forEach(function(it,i){
      if(it.g!==last){h+='<div class="grp">'+it.g+'</div>';last=it.g}
      h+='<button class="it'+(i===pal.i?' on':'')+'" data-i="'+i+'">'+PX.icon(it.icon)+'<span>'+it.label+'</span>'+(it.key?'<kbd>'+it.key+'</kbd>':'')+'</button>';
    });
    if(!pal.list.length)h='<div class="grp">Sin resultados</div>';
    return '<div class="scrim"><div class="pal" role="dialog" aria-label="Paleta de comandos"><div class="in">'+PX.icon('search')+'<input id="pq" placeholder="Buscar vista o acción…" value="'+pal.q.replace(/"/g,'&quot;')+'" autocomplete="off"></div><div class="list">'+h+'</div></div></div>';
  }
  function openPal(){pal={q:'',i:0,list:filtered('')};paintSheet()}
  function closePal(){pal=null;paintSheet()}
  document.getElementById('open').addEventListener('click',openPal);
  document.getElementById('layer').addEventListener('input',function(e){
    if(e.target.id!=='pq')return;pal.q=e.target.value;pal.list=filtered(pal.q);pal.i=0;
    var pos=e.target.selectionStart;paintSheet();var n=document.getElementById('pq');n.setSelectionRange(pos,pos);
  });
  var chord=0;
  document.addEventListener('keydown',function(e){
    var typing=/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName);
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal?closePal():openPal();return}
    if(pal){
      if(e.key==='Escape'){closePal()}
      else if(e.key==='ArrowDown'){e.preventDefault();pal.i=Math.min(pal.i+1,pal.list.length-1);paintSheet()}
      else if(e.key==='ArrowUp'){e.preventDefault();pal.i=Math.max(pal.i-1,0);paintSheet()}
      else if(e.key==='Enter'){var r=pal.list[pal.i];if(r){closePal();r.run()}}
      return;
    }
    if(e.key==='Escape'){if(sheet){sheet=null;paintSheet()}else if(cardOpen){cardOpen=false;paintCard()}return}
    if(typing)return;
    if(chord&&Date.now()-chord<1200){var v=KEY[e.key.toLowerCase()];chord=0;if(v){openView(v)}return}
    if(e.key.toLowerCase()==='g'){chord=Date.now()}
  });
  document.getElementById('card').addEventListener('click',function(e){
    if(e.target.closest('[data-x]')){cardOpen=false;paintCard();return}
    var b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;paintCard()}
  });
  function paintCard(){
    var s=M.step(M.selected),el=document.getElementById('card');
    var show=cardOpen&&s&&!s.start;
    el.hidden=!show;
    document.getElementById('cvs').classList.toggle('shift',show);
    document.getElementById('form').classList.toggle('shift',show);
    if(!show)return;
    var st=M.status(s);
    el.innerHTML='<div class="hd"><b>Paso '+s.n+' · '+s.label+'</b><button class="x" data-x aria-label="Cerrar panel">'+PX.icon('x')+'</button></div>'+
      PX.detailHTML(s,tab)+
      '<div class="tabs">'+[['decision','Decisión'],['evidence','Evidencia'],['policy','Política'],['receipt','Recibo']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>';
  }
  M.on(function(){
    document.getElementById('sd').className='dot'+(M.running?' run':'');
    paintCard();
    if(sheet==='decisions'){var b=document.querySelector('.sheet .sb');if(b)b.innerHTML=PX.viewHTML('decisions')}
  });
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('q').value='';M.run()});
})();
</script>
</body>
</html>
